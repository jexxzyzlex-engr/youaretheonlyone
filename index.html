<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Youaretheonlyone</title>
  <meta name="theme-color" content="#2a0a10" />
  <meta name="description" content="Youaretheonlyone — a six-year countdown." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0iIzJhMGExMCIvPjx0ZXh0IHg9IjE2IiB5PSIyMSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2U4Yzk2YSIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtd2VpZ2h0PSI2MDAiPlo8L3RleHQ+PC9zdmc+" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#2a0a10',
            surface: '#3a1218',
            fg: '#fff6e8',
            muted: '#e0c9a4',
            primary: '#e8c96a',
            accent: '#f5e6b2',
            border: '#6a3a28',
            sky: '#d4a84b',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            serif: ['Cormorant Garamond', 'Georgia', 'Times New Roman', 'serif'],
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      background: #2a0a10;
      color: #fff6e8;
      font-family: Inter, system-ui, sans-serif;
      margin: 0;
      min-height: 100dvh;
    }
    button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
    input[type="range"] { accent-color: #e8c96a; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <main class="relative flex min-h-dvh flex-col items-center justify-start overflow-x-hidden bg-bg px-4 pt-32 pb-16 text-fg sm:justify-center sm:pt-16">
    <!-- Gold Clock background -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 overflow-hidden" id="gold-clock" style="background: linear-gradient(135deg, #2a0a10 0%, #4a1520 40%, #2a0a10 100%);">
      <div class="absolute inset-0" style="background: radial-gradient(ellipse at center, transparent 18%, rgb(40 8 12 / 0.5) 100%);"></div>
      <div class="absolute top-1/2 left-1/2 w-[min(96vw,780px)] -translate-x-1/2 -translate-y-1/2">
        <svg class="size-full drop-shadow-[0_0_40px_rgb(232_201_106_/_0.45)]" viewBox="0 0 200 200" id="clock-svg">
          <defs>
            <radialGradient id="gold-face" cx="50%" cy="38%" r="70%">
              <stop offset="0%" stop-color="#5a1c22" stop-opacity="0.12" />
              <stop offset="100%" stop-color="#2a0a10" stop-opacity="0.28" />
            </radialGradient>
            <linearGradient id="gold-stroke" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff3c4" />
              <stop offset="45%" stop-color="#e8c96a" />
              <stop offset="100%" stop-color="#b8862a" />
            </linearGradient>
            <filter id="gold-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.6" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <circle cx="100" cy="100" r="96" fill="url(#gold-face)" />
          <circle cx="100" cy="100" r="94" fill="none" stroke="url(#gold-stroke)" stroke-width="1.2" />
          <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gold-stroke)" stroke-width="0.6" opacity="0.7" />
          <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold-stroke)" stroke-width="1.8" />
          <g id="ticks"></g>
          <g id="romans"></g>
          <g id="hour-hand" filter="url(#gold-glow)" style="transform-origin: 100px 100px;">
            <path d="M96.6 108 L98.4 58 L100 46 L101.6 58 L103.4 108 Z" fill="#4a2010" />
            <path d="M97.4 106 L99 58 L100 50 L101 58 L102.6 106 Z" fill="#f8ecc0" />
          </g>
          <g id="minute-hand" filter="url(#gold-glow)" style="transform-origin: 100px 100px;">
            <path d="M97.4 114 L99 34 L100 22 L101 34 L102.6 114 Z" fill="#3a180c" />
            <path d="M98.1 112 L99.3 34 L100 26 L100.7 34 L101.9 112 Z" fill="#ffe9a0" />
          </g>
          <g id="second-hand" filter="url(#gold-glow)" style="transform-origin: 100px 100px;">
            <line x1="100" y1="128" x2="100" y2="18" stroke="#5a2410" stroke-width="2.4" stroke-linecap="round" />
            <line x1="100" y1="126" x2="100" y2="20" stroke="#ffd36a" stroke-width="1.15" stroke-linecap="round" />
            <circle cx="100" cy="24" r="2.1" fill="#fff4c8" />
          </g>
          <circle cx="100" cy="100" r="5.2" fill="#fff4c8" />
          <circle cx="100" cy="100" r="2.2" fill="#c9a227" />
        </svg>
      </div>
    </div>

    <div class="pointer-events-none fixed inset-0 z-[1] bg-[#2a0a10]/20"></div>

    <!-- World Time -->
    <div class="fixed top-4 right-4 z-20 rounded-2xl border border-primary/40 bg-surface/90 px-3 py-2 text-right shadow-[0_0_24px_rgb(232_201_106_/_0.2)] backdrop-blur-sm sm:top-6 sm:right-8 sm:px-4 sm:py-2.5" id="world-time">
      <p class="font-serif text-[10px] tracking-[0.22em] text-primary uppercase">World time</p>
      <p class="font-serif text-lg leading-tight text-accent tabular-nums sm:text-2xl" id="utc-time">--:--:-- <span class="ml-1.5 text-xs tracking-widest text-muted">UTC</span></p>
      <p class="mt-0.5 font-serif text-xs text-muted tabular-nums" id="local-time"></p>
    </div>

    <div class="relative z-10 w-full max-w-3xl text-center">
      <p class="mb-3 font-serif text-sm font-medium tracking-[0.28em] text-primary uppercase">
        Live Countdown
      </p>
      <h1 class="mb-2 font-serif text-4xl font-semibold tracking-tight text-accent sm:text-5xl">
        Have i failed?
      </h1>
      <p class="mb-8 font-serif font-light text-muted italic">Time remaining until September 24, 2032</p>

      <div class="mb-8 inline-flex items-center gap-2 rounded-full border border-primary/40 bg-surface/80 px-5 py-2 font-serif text-sm text-accent shadow-[0_0_20px_rgb(232_201_106_/_0.15)] backdrop-blur-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-80" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        <span>September 24, 2032</span>
      </div>

      <div class="mb-10 grid grid-cols-2 gap-3 sm:grid-cols-4 sm:gap-4" id="units">
        <div class="relative overflow-hidden rounded-2xl border border-primary/35 bg-surface/75 px-3 py-6 shadow-[0_0_28px_rgb(232_201_106_/_0.12)] backdrop-blur-sm transition hover:-translate-y-0.5 hover:border-primary/70 hover:shadow-[0_12px_40px_rgb(232_201_106_/_0.28)]">
          <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-r from-transparent via-primary to-transparent opacity-80"></div>
          <div class="font-serif text-4xl leading-none tracking-tight text-accent sm:text-5xl" id="days">0</div>
          <div class="mt-2.5 text-xs font-medium tracking-widest text-primary uppercase">Days</div>
        </div>
        <div class="relative overflow-hidden rounded-2xl border border-primary/35 bg-surface/75 px-3 py-6 shadow-[0_0_28px_rgb(232_201_106_/_0.12)] backdrop-blur-sm transition hover:-translate-y-0.5 hover:border-primary/70 hover:shadow-[0_12px_40px_rgb(232_201_106_/_0.28)]">
          <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-r from-transparent via-primary to-transparent opacity-80"></div>
          <div class="font-serif text-4xl leading-none tracking-tight text-accent sm:text-5xl" id="hours">00</div>
          <div class="mt-2.5 text-xs font-medium tracking-widest text-primary uppercase">Hours</div>
        </div>
        <div class="relative overflow-hidden rounded-2xl border border-primary/35 bg-surface/75 px-3 py-6 shadow-[0_0_28px_rgb(232_201_106_/_0.12)] backdrop-blur-sm transition hover:-translate-y-0.5 hover:border-primary/70 hover:shadow-[0_12px_40px_rgb(232_201_106_/_0.28)]">
          <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-r from-transparent via-primary to-transparent opacity-80"></div>
          <div class="font-serif text-4xl leading-none tracking-tight text-accent sm:text-5xl" id="minutes">00</div>
          <div class="mt-2.5 text-xs font-medium tracking-widest text-primary uppercase">Minutes</div>
        </div>
        <div class="relative overflow-hidden rounded-2xl border border-primary/35 bg-surface/75 px-3 py-6 shadow-[0_0_28px_rgb(232_201_106_/_0.12)] backdrop-blur-sm transition hover:-translate-y-0.5 hover:border-primary/70 hover:shadow-[0_12px_40px_rgb(232_201_106_/_0.28)]">
          <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-r from-transparent via-primary to-transparent opacity-80"></div>
          <div class="font-serif text-4xl leading-none tracking-tight text-accent sm:text-5xl animate-pulse" id="seconds">00</div>
          <div class="mt-2.5 text-xs font-medium tracking-widest text-primary uppercase">Seconds</div>
        </div>
      </div>

      <div class="mx-auto w-full max-w-md">
        <div class="mb-2 flex justify-between font-serif text-sm text-muted">
          <span>Progress</span>
          <span id="percent">0.00%</span>
        </div>
        <div class="h-1.5 overflow-hidden rounded-full border border-primary/25 bg-[#2a0a10]/70">
          <div class="h-full rounded-full bg-gradient-to-r from-primary to-accent transition-[width] duration-1000" id="progress-bar" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <p class="relative z-10 mt-10 font-serif text-sm text-muted italic">
      Countdown started from September 24, 2026
    </p>

    <!-- Volume Dock -->
    <div class="fixed bottom-5 left-4 z-20 sm:bottom-8 sm:left-8" id="volume-dock">
      <button type="button" id="enter-btn" class="rounded-full border border-primary/50 bg-surface/90 px-4 py-2 font-serif text-sm text-accent shadow-[0_0_24px_rgb(232_201_106_/_0.25)] backdrop-blur-sm hover:border-primary">
        Enter lobby
      </button>
      <div id="volume-controls" class="hidden flex items-center gap-2 rounded-full border border-primary/40 bg-surface/90 px-3 py-2 shadow-[0_0_24px_rgb(232_201_106_/_0.2)] backdrop-blur-sm">
        <button type="button" id="mute-btn" aria-label="Mute lobby music" class="grid size-8 place-items-center rounded-full text-primary hover:bg-primary/15">
          <svg id="vol-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button type="button" id="vol-down" aria-label="Lower volume" class="grid size-8 place-items-center rounded-full text-primary hover:bg-primary/15">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
        </button>
        <span id="vol-pct" class="min-w-[2.5rem] text-center font-serif text-sm text-accent tabular-nums">55%</span>
        <button type="button" id="vol-up" aria-label="Raise volume" class="grid size-8 place-items-center rounded-full text-primary hover:bg-primary/15">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
    </div>

    <blockquote class="pointer-events-none absolute right-4 bottom-16 z-10 max-w-[14rem] text-right sm:right-8 sm:bottom-8 sm:max-w-xs">
      <p class="font-serif text-lg leading-snug font-medium text-accent/90 italic sm:text-xl">
        From 6 years ago to
        <br />
        You from Today
      </p>
      <footer class="mt-2 font-serif text-base text-muted italic">— Jexxz</footer>
    </blockquote>
  </main>

  <script>
    // === Lobby Audio (preserved) ===
    const STORAGE_KEY = "lobby-volume";
    const DEFAULT_VOLUME = 0.55;
    let volume = DEFAULT_VOLUME;
    let muted = false;
    let music = null;
    let ctx = null;
    let unlocked = false;
    let lastTickSec = -1;

    function clamp(n) { return Math.min(1, Math.max(0, n)); }
    function loadSaved() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw == null) return;
        const n = Number(raw);
        if (!Number.isNaN(n)) volume = clamp(n);
      } catch {}
    }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, String(volume)); } catch {}
    }
    function appliedVolume() { return muted ? 0 : volume; }
    function ensureMusic() {
      if (music) return music;
      const el = new Audio("xevel.mp3");
      el.loop = true;
      el.preload = "auto";
      el.volume = appliedVolume();
      music = el;
      return el;
    }
    function ensureCtx() {
      if (ctx) return ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      return ctx;
    }
    async function unlockLobby() {
      loadSaved();
      const el = ensureMusic();
      el.volume = appliedVolume();
      const audioCtx = ensureCtx();
      if (audioCtx && audioCtx.state === "suspended") {
        await audioCtx.resume().catch(() => {});
      }
      try {
        await el.play();
        unlocked = true;
        updateVolumeUI();
      } catch {
        unlocked = false;
        updateVolumeUI();
      }
    }
    function setLobbyVolume(next) {
      volume = clamp(next);
      if (volume > 0) muted = false;
      if (music) music.volume = appliedVolume();
      save();
      updateVolumeUI();
    }
    function nudgeLobbyVolume(delta) { setLobbyVolume(volume + delta); }
    function toggleLobbyMute() {
      muted = !muted;
      if (music) music.volume = appliedVolume();
      updateVolumeUI();
    }
    function playTick(high) {
      if (!unlocked || muted || volume <= 0) return;
      const audioCtx = ensureCtx();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = high ? 1180 : 780;
      const peak = 0.045 * volume;
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(peak, now);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.07);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }
    function tickIfSecondChanged(secondFloat) {
      const sec = Math.floor(secondFloat) % 60;
      if (sec === lastTickSec) return;
      lastTickSec = sec;
      playTick(sec % 2 === 0);
    }

    function updateVolumeUI() {
      const enter = document.getElementById("enter-btn");
      const controls = document.getElementById("volume-controls");
      const pct = document.getElementById("vol-pct");
      const silent = muted || volume === 0;
      if (unlocked) {
        enter.classList.add("hidden");
        controls.classList.remove("hidden");
        controls.classList.add("flex");
      } else {
        enter.classList.remove("hidden");
        controls.classList.add("hidden");
        controls.classList.remove("flex");
      }
      pct.textContent = Math.round(volume * 100) + "%";
      const icon = document.getElementById("vol-icon");
      if (silent) {
        icon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
      } else {
        icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
      }
    }

    document.getElementById("enter-btn").addEventListener("click", () => unlockLobby());
    document.getElementById("mute-btn").addEventListener("click", toggleLobbyMute);
    document.getElementById("vol-down").addEventListener("click", () => nudgeLobbyVolume(-0.1));
    document.getElementById("vol-up").addEventListener("click", () => nudgeLobbyVolume(0.1));
    window.addEventListener("pointerdown", () => { if (!unlocked) unlockLobby(); }, { once: true });
    window.addEventListener("keydown", () => { if (!unlocked) unlockLobby(); }, { once: true });
    loadSaved();
    updateVolumeUI();

    // === Clock ===
    const TARGET = new Date("2032-09-24T21:14:00-07:00").getTime();
    const START = new Date("2026-09-24T21:14:00-07:00").getTime();
    const TOTAL = TARGET - START;
    const ROMAN = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];

    // Build ticks & romans
    const ticksG = document.getElementById("ticks");
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", "100");
      line.setAttribute("y1", major ? "16" : "18");
      line.setAttribute("x2", "100");
      line.setAttribute("y2", major ? "24" : "21");
      line.setAttribute("stroke", major ? "#f5e6a8" : "rgb(232 201 106 / 0.45)");
      line.setAttribute("stroke-width", major ? "1.5" : "0.6");
      line.setAttribute("transform", `rotate(${i * 6} 100 100)`);
      ticksG.appendChild(line);
    }
    const romansG = document.getElementById("romans");
    ROMAN.forEach((label, i) => {
      const a = ((i * 30 - 90) * Math.PI) / 180;
      const x = (100 + 68 * Math.cos(a)).toFixed(2);
      const y = (100 + 68 * Math.sin(a)).toFixed(2);
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");
      text.setAttribute("fill", "#f6e7b2");
      text.setAttribute("font-family", "Georgia, 'Times New Roman', serif");
      text.setAttribute("font-size", (label === "XII" || label === "III" || label === "VI" || label === "IX") ? "11" : "9");
      text.setAttribute("font-weight", "600");
      text.setAttribute("filter", "url(#gold-glow)");
      text.textContent = label;
      romansG.appendChild(text);
    });

    function remainingAngles() {
      const diff = Math.max(0, TARGET - Date.now());
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = (diff % (1000 * 60)) / 1000;
      return {
        hour: ((hours % 12) + minutes / 60) * 30,
        minute: (minutes + seconds / 60) * 6,
        second: seconds * 6,
        seconds,
      };
    }

    function pad(n) { return n.toString().padStart(2, "0"); }

    function updateCountdown() {
      const now = Date.now();
      const diff = TARGET - now;
      let days = 0, hours = 0, minutes = 0, seconds = 0, percent = 100, done = true;
      if (diff > 0) {
        days = Math.floor(diff / (1000 * 60 * 60 * 24));
        hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        seconds = Math.floor((diff % (1000 * 60)) / 1000);
        const elapsed = now - START;
        percent = Math.min(100, Math.max(0, (elapsed / TOTAL) * 100));
        done = false;
      }
      document.getElementById("days").textContent = days.toLocaleString();
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
      document.getElementById("percent").textContent = percent.toFixed(2) + "%";
      document.getElementById("progress-bar").style.width = percent + "%";
    }

    function updateClock() {
      const next = remainingAngles();
      document.getElementById("hour-hand").style.transform = `rotate(${next.hour}deg)`;
      document.getElementById("minute-hand").style.transform = `rotate(${next.minute}deg)`;
      document.getElementById("second-hand").style.transform = `rotate(${next.second}deg)`;
      tickIfSecondChanged(next.seconds);
    }

    function updateWorldTime() {
      const d = new Date();
      const utc = new Intl.DateTimeFormat("en-GB", {
        timeZone: "UTC", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23",
      }).format(d);
      const local = new Intl.DateTimeFormat(undefined, {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", timeZoneName: "short",
      }).format(d);
      document.getElementById("utc-time").innerHTML = utc + ' <span class="ml-1.5 text-xs tracking-widest text-muted">UTC</span>';
      document.getElementById("local-time").textContent = local;
    }

    // Init
    updateCountdown();
    updateClock();
    updateWorldTime();
    setInterval(updateCountdown, 1000);
    setInterval(updateWorldTime, 1000);
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) {
      setInterval(updateClock, 1000);
    } else {
      function loop() {
        updateClock();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
